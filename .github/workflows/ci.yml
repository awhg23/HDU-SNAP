name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  python-lite:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install lite and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest
      - name: Check shell script syntax
        if: runner.os != 'Windows'
        run: bash -n start_backend.sh setup_full_macos.sh install_vector_tier.sh scripts/*.sh scripts/lib/*.sh
      - name: Check compatibility entry points
        run: |
          python main.py config --check
          python -c "import generate_debug_report"

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed bundles are current
        run: git diff --exit-code -- dist
