<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HDU-SNAP 设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>HDU-SNAP 设置</h1>
      <p>配置本机后端地址。仅允许连接到 <code>127.0.0.1</code> 或 <code>localhost</code>。</p>
      <label for="backend-url">后端地址</label>
      <input id="backend-url" type="url" spellcheck="false" autocomplete="off">
      <div class="actions">
        <button id="save" type="button">保存</button>
        <button id="test" type="button">测试连接</button>
        <button id="reset" type="button" class="secondary">恢复默认</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="dist/options.js"></script>
  </body>
</html>
